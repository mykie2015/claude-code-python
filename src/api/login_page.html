<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - NexaBank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Source+Serif+4:opsz,wght@8..72,400;8..72,500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FAFAF8;
            --text-charcoal: #2D2D2D;
            --accent-gold: #B8860B;
            --accent-gold-light: #DAA520;
            --border-light: #E5E5E3;
            --shadow-subtle: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-hover: 0 8px 24px rgba(0,0,0,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg-cream);
            color: var(--text-charcoal);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 400px;
            padding: 48px 40px;
            border-radius: 2px;
            box-shadow: var(--shadow-subtle);
            transition: box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-mark {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 500;
            color: var(--text-charcoal);
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .brand h1 {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--text-charcoal);
            margin-bottom: 8px;
        }

        .brand p {
            font-size: 14px;
            color: #888;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border-light);
            border-radius: 2px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-charcoal);
            background: #FAFAF8;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-gold);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.1);
        }

        .input-field::placeholder {
            color: #B0B0AE;
        }

        .password-wrapper {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
            padding: 4px;
            font-size: 18px;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--text-charcoal);
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-gold);
            cursor: pointer;
        }

        .checkbox-wrapper span {
            font-size: 14px;
            color: #666;
        }

        .forgot-link {
            font-size: 14px;
            color: var(--accent-gold);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--accent-gold-light);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--text-charcoal);
            color: #FFFFFF;
            border: none;
            border-radius: 2px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            letter-spacing: 0.03em;
        }

        .submit-btn:hover {
            background: #1a1a1a;
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        .submit-btn.loading .btn-text {
            visibility: hidden;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-toast {
            background: #FFF5F5;
            border: 1px solid #FED7D7;
            color: #C53030;
            padding: 12px 16px;
            border-radius: 2px;
            font-size: 14px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .error-toast.show {
            display: flex;
        }

        .security-note {
            text-align: center;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-light);
            font-size: 12px;
            color: #999;
        }

        .security-note span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 440px) {
            .login-card {
                padding: 32px 24px;
            }

            .brand h1 {
                font-size: 20px;
            }
        }

        /* Page load animation */
        .login-card {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.5s ease forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            opacity: 0;
            animation: staggerIn 0.4s ease forwards;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }

        @keyframes staggerIn {
            to {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-mark">N</div>
            <h1>Welcome Back</h1>
            <p>Sign in to your account</p>
        </div>

        <div class="error-toast" id="errorToast">
            <span>!</span>
            <span id="errorText"></span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="country">Country / Region</label>
                <select id="country" name="country" class="input-field" required>
                    <option value="">Select country</option>
                    <option value="US">United States</option>
                    <option value="GB">United Kingdom</option>
                    <option value="CA">Canada</option>
                    <option value="AU">Australia</option>
                    <option value="DE">Germany</option>
                    <option value="FR">France</option>
                    <option value="JP">Japan</option>
                    <option value="SG">Singapore</option>
                    <option value="HK">Hong Kong</option>
                    <option value="CH">Switzerland</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="input-field"
                    placeholder="name@example.com"
                    required
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="input-field"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <span id="eyeIcon">👁</span>
                    </button>
                </div>
            </div>

            <div class="form-row">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="remember" name="remember">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span class="btn-text">Sign In</span>
                <div class="spinner"></div>
            </button>
        </form>

        <div class="security-note">
            <span>🔒 256-bit SSL encryption</span>
        </div>
    </div>

    <script>
        const DEMO_MODE = true;

        function togglePassword() {
            const input = document.getElementById('password');
            const eye = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                eye.textContent = '🙈';
            } else {
                input.type = 'password';
                eye.textContent = '👁';
            }
        }

        function showError(message) {
            const toast = document.getElementById('errorToast');
            document.getElementById('errorText').textContent = message;
            toast.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorToast').classList.remove('show');
        }

        function setLoading(loading) {
            const btn = document.getElementById('submitBtn');
            if (loading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideError();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const country = document.getElementById('country').value;
            const remember = document.getElementById('remember').checked;

            if (!country) {
                showError('Please select your country');
                return;
            }

            setLoading(true);

            if (DEMO_MODE) {
                await new Promise(r => setTimeout(r, 1200));
                if (remember) {
                    localStorage.setItem('remember_email', email);
                } else {
                    localStorage.removeItem('remember_email');
                }
                alert('Demo: Login successful!\n\nEmail: ' + email);
                setLoading(false);
                return;
            }

            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, country_code: country })
                });

                const data = await response.json();

                if (response.ok) {
                    if (data.mfa_required && data.temp_token) {
                        sessionStorage.setItem('mfa_temp_token', data.temp_token);
                        window.location.href = '/mfa-verify';
                    } else {
                        if (remember) {
                            localStorage.setItem('remember_email', email);
                        } else {
                            localStorage.removeItem('remember_email');
                        }
                        window.location.href = '/dashboard';
                    }
                } else {
                    showError(data.detail || 'Login failed');
                }
            } catch (error) {
                showError('Connection error. Please try again.');
            } finally {
                setLoading(false);
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const remembered = localStorage.getItem('remember_email');
            if (remembered) {
                document.getElementById('email').value = remembered;
                document.getElementById('remember').checked = true;
            }
        });
    </script>
</body>
</html>
